# 알림 발송 장애 측정(#137)의 로컬 리허설용 app 실행 구성. setup.sh가 리허설 디렉터리에 복사한다.
# 운영 실행 구성(deploy/app/compose.yaml)에서 측정에 영향을 주는 부분(서비스 이름, env_file, 자동 재시작, 종료 대기)을 같게 두고,
# 포트는 이 컴퓨터에만 연다. cloudflared는 Tunnel 대신 멈추고 켜는 것만 확인하는 빈 컨테이너다.
name: gov-benefit-app-rehearsal

services:
  app:
    image: gov-benefit-helper:${APP_TAG:?APP_TAG가 없습니다}
    env_file: app.env
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g
    stop_grace_period: 40s
    restart: unless-stopped

  cloudflared:
    image: alpine:3.20
    command: sleep infinity
    restart: unless-stopped
