# app VM 실행 구성(결정 0036). VM의 /opt/gov-benefit/app/에 둔다.
# scripts/deploy.sh가 배포하는 태그 시점의 이 파일을 복사하고, 같은 디렉터리의 .env에 APP_TAG만 적는다.
# 비밀값은 VM의 app.env·cloudflared.env에만 둔다(각 .example 참고). 절차는 docs/ops/deploy.md.
name: gov-benefit-app

services:
  app:
    image: ghcr.io/tukjw/gov-benefit-helper:${APP_TAG:?APP_TAG가 없습니다. scripts/deploy.sh로 배포하세요}
    env_file: app.env
    ports:
      # VM 안에서만 연다. 외부 요청은 cloudflared가 Compose 네트워크로 전달한다.
      - "127.0.0.1:8080:8080"
      # 관리 포트(상태 확인·지표, 결정 0036). 배포 스크립트는 127.0.0.1로, 지표 VM의 Prometheus는 내부 브리지(vmbr1)로 읽는다.
      # Tunnel 경로는 8080뿐이라 외부로 열리지 않는다. 배포 스크립트가 .env를 APP_TAG 한 줄로 덮어써 주소를 여기 적는다.
      - "127.0.0.1:8081:8081"
      - "10.10.0.11:8081:8081"
    # JVM 힙은 이 한도의 75%다(backend/Dockerfile).
    mem_limit: 3g
    # Spring의 정상 종료 대기(30초)가 끝나기 전에 강제 종료하지 않는다.
    stop_grace_period: 40s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cloudflared:
    # Cloudflare는 1년이 지난 버전을 지원하지 않아 고정하지 않는다. 배포 스크립트는 app만 받으므로
    # 갱신은 docs/ops/deploy.md의 절차로 따로 한다.
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    # TUNNEL_TOKEN. Tunnel의 경로(api.govbenefit.kr → http://app:8080)는 Cloudflare 대시보드에 둔다.
    env_file: cloudflared.env
    depends_on:
      - app
    restart: unless-stopped
    logging: *logging

  # VM의 CPU·메모리·디스크 지표(결정 0036). 내부 브리지(vmbr1) 주소에만 리슨한다.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --web.listen-address=10.10.0.11:9100
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    logging: *logging
