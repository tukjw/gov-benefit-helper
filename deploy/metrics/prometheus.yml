# 지표 VM의 Prometheus 수집 대상(결정 0036). 모두 내부 브리지(vmbr1) 주소다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 앱의 관리 포트. 요청·JVM·커넥션 풀·수집 실행 결과
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["10.10.0.11:8081"]
        labels:
          vm: app

  # VM의 CPU·메모리·디스크
  - job_name: node
    static_configs:
      - targets: ["10.10.0.11:9100"]
        labels:
          vm: app
      - targets: ["10.10.0.12:9100"]
        labels:
          vm: db

  # MySQL 연결·쿼리
  - job_name: mysql
    static_configs:
      - targets: ["10.10.0.12:9104"]
        labels:
          vm: db

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
