# db VM 실행 구성(결정 0036). VM의 /opt/gov-benefit/db/에 두고 같은 디렉터리의 .env(.env.example 참고)로 값을 받는다.
# 배포 스크립트는 db를 건드리지 않는다. 바꿀 때는 docs/ops/deploy.md의 절차를 따른다.
name: gov-benefit-db

services:
  mysql:
    # 문자 집합·정렬(결정 0001)과 시간대(결정 0002)는 로컬(docker-compose.local.yml)과 같다.
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 데이터가 100MB 안쪽이라 전부 메모리에 올라간다. VM 메모리(4GB)의 4분의 1이다.
      - --innodb-buffer-pool-size=1G
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${DB_NAME:?}
      MYSQL_USER: ${DB_USER:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      TZ: Asia/Seoul
    ports:
      # 내부 브리지(vmbr1)의 주소에만 연다. LAN에서는 닿지 않고 app VM만 접속한다.
      - "${DB_BIND:?}:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mysql-data:
