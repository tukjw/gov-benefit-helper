# db VM 실행 구성(결정 0037). VM의 /opt/gov-benefit/db/에 두고 같은 디렉터리의 .env(.env.example 참고)로 값을 받는다.
# 배포 스크립트는 db를 건드리지 않는다. 바꿀 때는 docs/ops/deploy.md의 절차를 따른다.
name: gov-benefit-db

services:
  mysql:
    # 문자 집합·정렬(결정 0001)과 시간대(결정 0002)는 로컬(docker-compose.local.yml)과 같다.
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 데이터가 100MB 안쪽이라 전부 메모리에 올라간다. VM 메모리(4GB)의 4분의 1이다.
      - --innodb-buffer-pool-size=1G
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${DB_NAME:?}
      MYSQL_USER: ${DB_USER:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      TZ: Asia/Seoul
    ports:
      # 내부 브리지(vmbr1)의 주소에만 연다. LAN에서는 닿지 않고 app VM만 접속한다.
      - "${DB_BIND:?}:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # VM의 CPU·메모리·디스크 지표(결정 0037). 내부 브리지(vmbr1) 주소에만 리슨한다.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --web.listen-address=${DB_BIND:?}:9100
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    logging: *logging

  # MySQL 연결·쿼리 지표(결정 0037). 지표 전용 계정 exporter는 docs/ops/metrics.md의 절차로 만든다.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.21.0
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD:?}
    ports:
      - "${DB_BIND:?}:9104:9104"
    depends_on:
      - mysql
    restart: unless-stopped
    logging: *logging

volumes:
  mysql-data:
