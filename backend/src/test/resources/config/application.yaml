# 테스트 공통 설정. classpath:/config/는 main의 application.yaml을 가리지 않고 그 위에 덮어쓴다.
spring:
  datasource:
    # 모든 테스트 컨텍스트가 MySQL 하나를 함께 쓰고(결정 0033), 캐시에 남은 컨텍스트도 풀을 열어 둔다.
    # 쓰지 않는 컨텍스트가 연결을 쥐고 있지 않게 유휴 연결을 1개만 남기고 10초 뒤 닫는다(결정 0043).
    # 최대 크기(기본 10)는 동시성 테스트가 연결을 동시에 쓰도록 줄이지 않는다.
    hikari:
      minimum-idle: 1
      # 밀리초. HikariCP는 10000보다 작은 값을 기본값 10분으로 되돌린다.
      idle-timeout: 10000

# 서명 키는 저장소에 두지 않고 테스트 컨텍스트마다 임의로 만든다(결정 0014).
auth:
  jwt:
    generate-secret-if-missing: true
  mail:
    # 실제 발송 없이 RecordingAccountMailSender에 기록만 한다(결정 0045). SES를 검증하는 테스트만 ses로 덮는다.
    sender: test
    # 메일을 요청 스레드에서 바로 보내 요청이 끝난 직후 가짜 발송의 기록을 읽는다. 비동기는 AccountMailAsyncTest가 확인한다.
    async: false

notification:
  new-benefit:
    # 정해진 시각에 돌아 테스트가 넣은 항목을 묶지 않게 끈다. 묶기 테스트는 bundleAll()을 직접 부른다.
    digest-cron: "-"
