spring:
  application:
    name: gov-benefit-helper
  config:
    # 작업 디렉터리의 .env를 KEY=VALUE 프로퍼티로 읽는다. ./gradlew는 backend/에서 실행한다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gov_benefit}?serverTimezone=Asia/Seoul
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    # 영속성 컨텍스트를 트랜잭션 범위로 한정한다. 지연 로딩은 @Transactional 서비스 안에서만 일어난다.
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)만 만든다. 엔티티와 스키마가 어긋나면 기동에 실패한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  task:
    execution:
      # 계정 메일 실행기(결정 0032)를 빈으로 두어도 기본 applicationTaskExecutor를 그대로 만든다.
      # 지정하지 않으면 Executor 빈이 하나라도 있을 때 기본 실행기가 빠진다.
      mode: force
  web:
    resources:
      # API 전용 서버라 정적 파일이 없다. 기본 매핑을 두면 springdoc을 꺼도 Swagger UI webjar가 /webjars/**로 열린다(결정 0012).
      add-mappings: false

# 운영에서는 Cloudflare Tunnel(cloudflared)만 앱에 요청을 보낸다(결정 0034). Cloudflare가 넣는 CF-Connecting-IP를
# 요청자 주소(getRemoteAddr)로 쓴다. 신뢰하는 프록시는 기본값(사설 대역)이며 cloudflared 컨테이너 주소가 여기에 든다.
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: CF-Connecting-IP

# 배포 스크립트가 기동 완료를 확인하는 상태 확인만 연다(결정 0034). 세부 정보는 보이지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health

# API 명세(/v3/api-docs)와 문서 화면(/swagger-ui.html)은 local 프로필에서만 연다(결정 0012).
springdoc:
  # 지정하지 않으면 성공 응답의 미디어 타입이 */*로 나온다.
  default-produces-media-type: application/json
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 공공서비스(혜택) API. 인증키는 GOV24_SERVICE_KEY(공공데이터포털 Decoding 키)로만 받는다. 수집할 때만 필요하다.
# 시간 제한·재시도·호출 예산은 결정 0006. 전체 수집은 정상일 때 33회 호출, 쪽 응답은 최대 1.1초였다.
gov24:
  base-url: https://api.odcloud.kr/api/gov24/v3
  service-key: ${GOV24_SERVICE_KEY:}
  per-page: 1000
  connect-timeout: 5s
  # 응답 헤더를 받을 때까지의 시간 제한
  read-timeout: 10s
  max-retries: 2
  retry-delay: 1s
  max-calls-per-run: 100
  schedule:
    enabled: true
    # 매일 04:00 (Asia/Seoul)
    cron: "0 0 4 * * *"

# 액세스 토큰(결정 0014). 서명 키는 JWT_SECRET(base64, 32바이트 이상)으로만 받고, 없으면 기동에 실패한다.
auth:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: gov-benefit-helper
    access-token-ttl: 15m
    # 키가 없을 때 임의 키를 만든다. local과 테스트에서만 켠다.
    generate-secret-if-missing: false
  # 리프레시 토큰(결정 0017). 재발급할 때마다 새 토큰이 ttl을 새로 받는다(연장 만료).
  # 교체 직후 reuse-grace 안에 이전 토큰이 다시 오면 거절만 하고 같은 로그인의 토큰을 폐기하지 않는다.
  refresh-token:
    ttl: 14d
    reuse-grace: 10s
  # 재발급 요청에 Origin 헤더가 있으면 이 목록에 있어야 한다(결정 0017). 프론트 주소다(DEC-APP).
  csrf:
    allowed-origins: https://govbenefit.kr
  # 가입 전 이메일 인증(결정 0019). 인증번호는 max-attempts번까지 비교하고, 맞히면 ticket-ttl 동안 쓸 가입 티켓을 준다.
  email-verification:
    code-ttl: 10m
    max-attempts: 5
    ticket-ttl: 30m
  # 비밀번호 재설정(결정 0019). 메일의 링크는 url#token=<토큰>이다. url은 프론트의 재설정 화면이다(DEC-APP).
  password-reset:
    token-ttl: 30m
    url: https://govbenefit.kr/reset-password
  # 로그인·탈퇴의 비밀번호 확인 시도 제한(결정 0035). 최근 window 안의 실패를 같은 이메일·IP에서
  # max-failures-per-email-and-ip번, 같은 IP에서 max-failures-per-ip번까지 받는다.
  login-attempt:
    window: 15m
    max-failures-per-email-and-ip: 5
    max-failures-per-ip: 30
  # 인증·재설정 메일 발송 제한(결정 0019). 같은 이메일에 cooldown 간격, 최근 window 안에 max-per-window번까지 보낸다.
  mail:
    cooldown: 60s
    window: 24h
    max-per-window: 10
    # 발송 구현(결정 0032). resend: Resend로 보낸다. logging: 보내지 않고 로그로 남긴다(local 전용).
    # 비워 두면 구현이 없어 기동에 실패한다. 배포 환경은 MAIL_SENDER=resend로 고른다.
    sender: ${MAIL_SENDER:}
    # 커밋 뒤 별도 스레드에서 보내 응답이 발송을 기다리지 않는다. 테스트만 false로 두고 호출한 스레드에서 보낸다.
    async: true
    # sender=resend일 때 쓴다. API 키와 발신 주소가 없으면 기동에 실패한다. 발신 도메인 인증은 docs/ops/mail-domain.md.
    resend:
      base-url: https://api.resend.com
      api-key: ${RESEND_API_KEY:}
      # 인증한 도메인의 주소. 예: 정부 혜택 도우미 <no-reply@govbenefit.kr>
      from: ${RESEND_FROM:}
      connect-timeout: 5s
      # 응답 헤더를 받을 때까지의 시간 제한
      read-timeout: 10s
