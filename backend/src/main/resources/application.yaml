spring:
  application:
    name: gov-benefit-helper
  config:
    # 작업 디렉터리의 .env를 KEY=VALUE 프로퍼티로 읽는다. ./gradlew는 backend/에서 실행한다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gov_benefit}?serverTimezone=Asia/Seoul
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    # 영속성 컨텍스트를 트랜잭션 범위로 한정한다. 지연 로딩은 @Transactional 서비스 안에서만 일어난다.
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)만 만든다. 엔티티와 스키마가 어긋나면 기동에 실패한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  web:
    resources:
      # API 전용 서버라 정적 파일이 없다. 기본 매핑을 두면 springdoc을 꺼도 Swagger UI webjar가 /webjars/**로 열린다(결정 0012).
      add-mappings: false

# API 명세(/v3/api-docs)와 문서 화면(/swagger-ui.html)은 local 프로필에서만 연다(결정 0012).
springdoc:
  # 지정하지 않으면 성공 응답의 미디어 타입이 */*로 나온다.
  default-produces-media-type: application/json
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 공공서비스(혜택) API. 인증키는 GOV24_SERVICE_KEY(공공데이터포털 Decoding 키)로만 받는다. 수집할 때만 필요하다.
# 시간 제한·재시도·호출 예산은 결정 0006. 전체 수집은 정상일 때 33회 호출, 쪽 응답은 최대 1.1초였다.
gov24:
  base-url: https://api.odcloud.kr/api/gov24/v3
  service-key: ${GOV24_SERVICE_KEY:}
  per-page: 1000
  connect-timeout: 5s
  # 응답 헤더를 받을 때까지의 시간 제한
  read-timeout: 10s
  max-retries: 2
  retry-delay: 1s
  max-calls-per-run: 100
  schedule:
    enabled: true
    # 매일 04:00 (Asia/Seoul)
    cron: "0 0 4 * * *"

# 액세스 토큰(결정 0014). 서명 키는 JWT_SECRET(base64, 32바이트 이상)으로만 받고, 없으면 기동에 실패한다.
auth:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: gov-benefit-helper
    access-token-ttl: 15m
    # 키가 없을 때 임의 키를 만든다. local과 테스트에서만 켠다.
    generate-secret-if-missing: false
