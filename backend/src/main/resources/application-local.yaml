spring:
  datasource:
    # docker-compose.local.yml이 만드는 로컬 전용 계정. backend/.env에 DB_USER, DB_PASSWORD가 있으면 그 값이 우선한다.
    # 단 .env에 빈 값으로 두면 빈 문자열이 되어 이 기본값이 적용되지 않으니 항목을 지운다.
    username: ${DB_USER:gov_benefit_user}
    password: ${DB_PASSWORD:gov_benefit_user}

logging:
  level:
    kr.govbenefit: DEBUG

# 로컬에서는 정기 수집을 끈다. 수동 수집은 collect 프로필로 한다.
gov24:
  schedule:
    enabled: false

# 문서 화면: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# JWT_SECRET이 없으면 기동할 때 임의 키를 만든다. 재시작하면 발급한 토큰이 무효가 된다.
auth:
  jwt:
    generate-secret-if-missing: true
  # 로컬 프론트(Next.js 기본 포트)
  csrf:
    allowed-origins: http://localhost:3000
  # 로컬 프론트의 재설정 화면
  password-reset:
    url: http://localhost:3000/reset-password
  # 메일을 보내지 않고 인증번호와 재설정 링크를 로그로 남긴다(결정 0032).
  # Resend로 실제 발송을 확인할 때는 환경 변수 AUTH_MAIL_SENDER=resend로 덮는다(.env의 값은 이 파일을 덮지 못한다).
  mail:
    sender: logging
